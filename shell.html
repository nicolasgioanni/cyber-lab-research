<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} · Cyber Lab</title>
  <link rel="icon" href="/assets/lab-mark.png" type="image/png">
  <link rel="stylesheet" href="/assets/portfolio-tokens.css">
  <link rel="stylesheet" href="/assets/study.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="{{PAGE_CLASS}}">
{{DIALOG_OPEN}}
<header class="site-header">
  <div class="header-inner">
    <span class="brand"><img src="/assets/lab-mark.png" alt="" width="36" height="36">Cyber Lab</span>
    <fieldset class="theme-picker" hidden><legend class="sr-only">Color mode</legend>
      <label><input type="radio" name="theme" value="light"><span class="sun" aria-hidden="true"></span>Light</label>
      <label><input type="radio" name="theme" value="dark"><span class="moon" aria-hidden="true"></span>Dark</label>
    </fieldset>
  </div>
</header>
{{MAIN}}
<footer class="site-footer"><span>Cyber Lab</span>{{FOOTER}}</footer>
{{DIALOG_CLOSE}}
</body>
</html>
