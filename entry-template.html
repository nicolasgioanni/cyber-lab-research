<dialog id="visitor-dialog" open closedby="none" aria-labelledby="gate-title" class="modal-dialog modal-dialog--in-place project-skill-dialog" data-state="open" data-topmost="true">
  <div class="modal-dialog__frame project-skill-dialog__frame">
    <div id="verification-stage" class="gate-stage">
      <div class="gate-copy">
        <h1 class="project-skill-dialog__title" id="gate-title" tabindex="-1" autofocus>Checking your connection</h1>
        <p class="project-skill-dialog__summary" id="verification-status" role="status" aria-live="polite">Cloudflare verifies your browser before the access notice opens.</p>
        <div id="turnstile-widget"></div>
        <p class="gate-policy-link"><a href="/access-notice" target="_blank" rel="noopener noreferrer">Read the access notice in a new tab</a></p>
        <noscript><p>Enable JavaScript in this browser to run Cloudflare verification. <a href="/exit">Leave the lab</a></p></noscript>
      </div>
      <div class="gate-actions verification-actions"><a href="/exit" class="glass-button glass-button--secondary hover-base-1">Leave</a><button class="glass-button glass-button--secondary hover-base-1" type="button" id="verification-retry" hidden>Retry verification</button></div>
    </div>
    <div id="notice-stage" class="gate-stage" hidden>
      <div class="gate-copy" tabindex="0" role="region" aria-labelledby="notice-title">
        <h1 id="notice-title" class="project-skill-dialog__title" tabindex="-1">Access notice</h1>
        {{NOTICE}}
      </div>
      <div class="gate-actions">
        <p id="accept-agreement" class="gate-agreement">{{AGREEMENT}}</p>
        <p id="notice-status" role="status" aria-live="polite"></p>
        <button type="button" id="decline-entry" class="glass-button glass-button--secondary hover-base-1">Decline</button>
        <button type="button" id="accept-entry" class="glass-button glass-button--primary hover-base-1 hover-base-1--solid">Accept and enter</button>
      </div>
    </div>
  </div>
</dialog>
